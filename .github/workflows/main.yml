name: Build PuTTY Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Generate Makefiles
        shell: cmd
        run: perl mkfiles.pl

      - name: Compile PuTTY
        shell: cmd
        working-directory: windows
        run: nmake -f Makefile.vc

      - name: Collect EXE files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Get-ChildItem windows -Recurse -Filter *.exe |
            Copy-Item -Destination dist -Force

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
