name: Build PuTTY Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Generate Windows Makefiles
        run: perl mkfiles.pl

      - name: Verify Makefile
        shell: pwsh
        run: |
          if (!(Test-Path "windows/Makefile.vc")) {
            throw "Windows Makefile generation failed"
          }

      - name: Compile PuTTY
        working-directory: windows
        run: nmake -f Makefile.vc

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Get-ChildItem windows -Recurse -Filter *.exe |
            Copy-Item -Destination dist -Force

          Get-ChildItem dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PuTTY-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
